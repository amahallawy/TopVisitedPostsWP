name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Composer deps are installed on the runner and mounted into the wp-env
      # tests container with the rest of the plugin (see .wp-env.json).
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # package-lock.json is not committed (see .gitignore).
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Start wp-env
        run: npx wp-env start

      - name: Run PHPUnit
        run: npm run test:php
